services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aguamata_owner
      POSTGRES_PASSWORD: owner_dev_pw
      POSTGRES_DB: aguamata
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aguamata_owner -d aguamata"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
volumes:
  pgdata:
